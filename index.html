<body >

    
    <div class="container">
        <input type="text" class="scm" id="ecran"><br>
        <div class="g">
        <button onclick="efface()" >C</button>
        <button onclick="opN('1')" >1</button>
        <button onclick="opN('2')" >3</button>
        <button onclick="calcule()" >=</button>

        <button onclick="opN('5')" >5</button>
        <button onclick="opN('6')" >6</button>
        <button onclick="opN('7')" >7</button>
        
        <button onclick="opN('4')" >4</button>
        <button onclick="opN('0')" >0</button>
        <button onclick="opN('9')" >9</button>
        <button onclick="opN('8')" >8</button>
        <button onclick="opN('2')" >2</button>
        
        <button onclick="ops('+')" >+</button>
        <button onclick="ops('-')" >-</button>
        <button onclick="ops('/')" >/</button>
        <button onclick="ops('*')" >*</button>
        </div>
    </div>


    <script>
        const Ecran = document.getElementById('ecran'); // sélection écran
        // function de recupèration de saisis des bouttons des numbres
        let Number1 = '', op = '', Number2 = '',  resultat = '';
      

       function opN(buttonNumber) { 
        
       if(op === '' ) {
        Number1 += Number(buttonNumber)

       } else {
        Number2 += Number(buttonNumber)


       }
       Ecran.value = buttonNumber;
        
       }


       function ops(operateurs) { // récupérations de operateurs
        op = operateurs;
        Ecran.value = op;
       }

     

      function efface () { // founction d'effassage d'ecran
        Ecran.value = '';
        Number1 = '';
        op = '';
        Number2 = ''

        return;
       }

function calcule() {
         switch(op) {
            case '+': resultat = Number(Number1) + Number(Number2); break;
            case '-': resultat =  Number(Number1) - Number(Number2); break;
            case '*': resultat = Number(Number1) * Number(Number2);break;
            case '/':  if(Number(Number1) === 0) {
                Ecran.value = 'Error invalid'.toLocaleUpperCase();
                return;
           } else{
                resultat = Number(Number1) / Number(Number2); break;
             }
             return;

        }
      misAjourEcran()
    }

    function misAjourEcran() {
        Number1 = '';
        Number2 = '';
        Ecran.value =  resultat
      
    }
  
   

  

    


    </script>
